<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>侧边栏快捷开关</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <main>
      <h1>侧边栏快捷开关</h1>
      <p>按 <strong>Alt + V</strong> 可以开关此扩展的侧边栏。</p>
      <p>如需修改快捷键，请到 Edge 的“扩展 -> 键盘快捷方式”。</p>
      <p class="note">
        说明：Edge 原生侧边栏暂无官方 API，扩展无法直接开关。此扩展使用的是
        扩展侧边栏（Side Panel）来模拟快速开关体验。
      </p>
    </main>
  </body>
</html>
